<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <input id="code" />
    <button id="btn">查詢</button>
    <p id="result"></p>
    <script>
      $("#btn").on("click", () => {
        $.ajax({
          url: "api/stock",
          data: { code: $("#code").val() },
          success: function (res) {
            if (res.qty === -1) {
              $("#result").text(`${res.code} :查無此商品`);
            } else {
              $("#result").text(`${res.code} : ${res.qty} 箱`);
            }
          },
        });
      });
    </script>
  </body>
</html>
